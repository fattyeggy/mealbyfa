# 生产/测试环境：真实 MySQL 配置
# 用法：--spring.profiles.active=mysql，并注入环境变量
spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/sancan?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
  sql:
    init:
      # 生产由 DBA 执行 schema.sql 与迁移脚本，应用不再自动建表
      mode: never
